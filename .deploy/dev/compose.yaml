services:
  llm-provider:
    image: nycusdc/sciedu-llm:dev
    container_name: sciedu-llm-provider-dev
    networks:
      - traefik
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: "https://portal.genai.nchc.org.tw/api"
      OPENAI_DEFAULT_MODEL: "gemma-4-31B-it"
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_BASE_URL: "https://langfuse-sciedu.sdc.nycu.club"
      LANGFUSE_TRACING_ENVIRONMENT: dev
      LOG_LEVEL: INFO

    labels:
      - "vector.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.sciedu-llm-dev.rule=Host(`llm.dev.sciedu.sdc.nycu.club`)"
      - "traefik.http.routers.sciedu-llm-dev.entrypoints=websecure"
      - "traefik.http.routers.sciedu-llm-dev.tls=true"
      - "traefik.http.routers.sciedu-llm-dev.tls.certresolver=cloudflare"
      - "traefik.http.services.sciedu-llm-dev.loadbalancer.server.port=8080"

  admin-panel:
    image: nycusdc/sciedu-llm-ui:dev
    container_name: sciedu-llm-admin-dev
    networks:
      - traefik
    restart: unless-stopped

    environment:
      BACKEND_URL: "http://llm-provider:8080"

    labels:
      - "vector.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.sciedu-llm-admin-dev.rule=Host(`admin.dev.sciedu.sdc.nycu.club`)"
      - "traefik.http.routers.sciedu-llm-admin-dev.entrypoints=websecure"
      - "traefik.http.routers.sciedu-llm-admin-dev.tls=true"
      - "traefik.http.routers.sciedu-llm-admin-dev.tls.certresolver=cloudflare"
      - "traefik.http.services.sciedu-llm-admin-dev.loadbalancer.server.port=80"

networks:
  traefik:
    external: true
