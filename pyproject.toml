[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["app", "rag", "judge"]
module-root = "src"

[project]
name = "sciedu-llm"
version = "0.2.0"
description = "An LLM service provider for NYCU's Cognition and Science Learning Laboratory"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.13.2",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.5.1",
    "numpy>=2.4.4",
    "openai>=2.15.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "tqdm>=4.67.1",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "poethepoet>=0.40.0",
    "pyright>=1.1.409",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
# `live` tests talk to a real Langfuse project, so they are opt-in: the default
# run (including `poe test`) deselects them, and `pytest -m live tests/live`
# overrides this to select only them. Everything else is unmarked and runs
# either way.
addopts = "-m \"not live\""
markers = [
    "integration: exercises the assembled app over a real socket (still hermetic and fast)",
    "live: requires real Langfuse credentials and writes to that project; opt in with `-m live`",
]

[tool.poe.tasks]
dev-api = "uv run uvicorn app.main:app --reload --port 8080"
dev-ui = { cmd = "pnpm dev", cwd = "ui" }
lint = "uv run ruff check"
format = "uv run ruff format"
test = "uv run pytest"

# Backend (:8080) and admin console (:5173) together; stops both when either
# exits or on Ctrl-C. The console needs `pnpm install` in ui/ once beforehand.
[tool.poe.tasks.dev]
interpreter = "bash"
shell = """
trap 'kill 0 2>/dev/null' EXIT
uv run uvicorn app.main:app --reload --port 8080 &
( cd ui && exec pnpm dev ) &
wait -n
"""
